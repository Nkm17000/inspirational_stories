name: Generate Video

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ✅ required for push

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # ✅ Checkout (FULL HISTORY REQUIRED)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0   # ✅ IMPORTANT

      # ✅ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      # ✅ Install ffmpeg
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ✅ Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ✅ Validate secret
      - name: Validate GROQ API Key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ GROQ_API_KEY is set"
          fi

      # ✅ Run script (this updates counter.json)
      - name: Run Video Generator
        run: python script.py

      # ✅ 🔥 COMMIT + PUSH COUNTER (CRITICAL FIX)
      - name: Commit counter update
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add counter.json

          git diff --cached --quiet || git commit -m "🔁 update counter"

          git push origin HEAD:main

      # ✅ Upload video
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4