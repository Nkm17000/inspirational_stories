name: Generate Video

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # --------------------------------------------------
      # MongoDB / API
      # --------------------------------------------------
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # --------------------------------------------------
      # Final Like / Subscribe page
      # --------------------------------------------------
      CTA_URL: "https://www.facebook.com/thesmartlearninglab"

      # --------------------------------------------------
      # Logo configuration
      # --------------------------------------------------
      LOGO_PATH: "logo.png"
      LOGO_SIZE: "125"
      LOGO_MARGIN: "18"

      # --------------------------------------------------
      # Video configuration
      # --------------------------------------------------
      END_CARD_DURATION: "5"
      TITLE_CARD_DURATION: "4"

      # --------------------------------------------------
      # IMPORTANT:
      # Supplied title-page design
      # --------------------------------------------------
      TITLE_TEMPLATE_PATH: "assets/title_page_template.png"

    steps:

      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================================================
      # Setup Python
      # ==================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ==================================================
      # Verify Python
      # ==================================================
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # ==================================================
      # Install system dependencies
      # ==================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          fc-cache -f -v

      # ==================================================
      # Verify Hindi fonts
      # ==================================================
      - name: Verify Hindi fonts
        run: |
          echo "=========================================="
          echo "Checking Devanagari fonts"
          echo "=========================================="

          fc-list :lang=hi family file | head -30

          echo ""
          echo "Noto Devanagari fonts:"
          find /usr/share/fonts \
            -iname "*Devanagari*" \
            | head -30

      # ==================================================
      # Verify project structure
      # ==================================================
      - name: Verify project structure
        run: |
          echo "=========================================="
          echo "Project structure"
          echo "=========================================="

          echo ""
          echo "Root files:"
          ls -lah

          echo ""
          echo "smart_video package:"
          ls -lah smart_video

          echo ""
          echo "Assets:"
          ls -lah assets || true

      # ==================================================
      # Verify logo
      # ==================================================
      - name: Verify Smart Learning Lab logo
        run: |
          if [ -f "$LOGO_PATH" ]; then
            echo "✅ logo.png found"
            ls -lh "$LOGO_PATH"
          else
            echo "❌ logo.png NOT found"
            echo ""
            echo "The video generator requires:"
            echo "  logo.png"
            echo ""
            echo "Place logo.png in the repository root."
            exit 1
          fi

      # ==================================================
      # Verify title-page template
      # ==================================================
      - name: Verify title page template
        run: |
          echo "Checking title page template..."

          if [ -f "$TITLE_TEMPLATE_PATH" ]; then
            echo "✅ Title page template found"
            ls -lh "$TITLE_TEMPLATE_PATH"
          else
            echo "❌ Title page template NOT found"
            echo ""
            echo "Expected file:"
            echo "  $TITLE_TEMPLATE_PATH"
            echo ""
            echo "Please put your supplied title-page image at:"
            echo "  assets/title_page_template.png"
            exit 1
          fi

      # ==================================================
      # Install Python dependencies
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ==================================================
      # Verify Python packages
      # ==================================================
      - name: Verify Python packages
        run: |
          python - <<'PY'
          import edge_tts
          import pymongo
          import requests
          import numpy
          import nest_asyncio
          import PIL
          import moviepy
          import qrcode

          print("==========================================")
          print("Python packages verified")
          print("==========================================")

          print("edge_tts      :", "OK")
          print("pymongo       :", "OK")
          print("requests      :", "OK")
          print("numpy         :", "OK")
          print("nest_asyncio  :", "OK")
          print("Pillow        :", "OK")
          print("moviepy       :", moviepy.__version__)
          print("qrcode        :", "OK")
          PY

      # ==================================================
      # Verify Edge TTS
      # ==================================================
      - name: Verify Edge TTS
        run: |
          edge-tts --version

      # ==================================================
      # Test Hindi TTS
      # ==================================================
      - name: Test Hindi TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              text = "एक विशाल पहाड़ी जंगल में अर्जुन नाम का एक लकड़हारा रहता था।"

              communicate = edge_tts.Communicate(
                  text=text,
                  voice="hi-IN-SwaraNeural",
                  rate="-15%"
              )

              await communicate.save("test_hindi.mp3")

          asyncio.run(main())

          print("✅ Hindi TTS test completed successfully")
          PY

          ls -lh test_hindi.mp3

      # ==================================================
      # Test English TTS
      # ==================================================
      - name: Test English TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              text = "Deep inside a vast mountain forest, Arjun lived in a small cabin."

              communicate = edge_tts.Communicate(
                  text=text,
                  voice="en-IN-NeerjaNeural",
                  rate="-15%"
              )

              await communicate.save("test_english.mp3")

          asyncio.run(main())

          print("✅ English TTS test completed successfully")
          PY

          ls -lh test_english.mp3

      # ==================================================
      # Validate MongoDB URI
      # ==================================================
      - name: Validate MongoDB URI
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "❌ MONGODB_URI is EMPTY"
            exit 1
          else
            echo "✅ MONGODB_URI is configured"
          fi

      # ==================================================
      # Validate Groq API key
      # ==================================================
      - name: Validate Groq API key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "⚠️ GROQ_API_KEY is EMPTY"
            echo "The current video generation script does not directly"
            echo "require Groq during video rendering."
          else
            echo "✅ GROQ_API_KEY is configured"
          fi

      # ==================================================
      # Validate CTA URL
      # ==================================================
      - name: Validate CTA URL
        run: |
          if [ -z "$CTA_URL" ]; then
            echo "❌ CTA_URL is EMPTY"
            exit 1
          else
            echo "✅ CTA_URL configured"
            echo "CTA page: $CTA_URL"
          fi

      # ==================================================
      # Validate title template configuration
      # ==================================================
      - name: Validate title page configuration
        run: |
          echo "TITLE_TEMPLATE_PATH=$TITLE_TEMPLATE_PATH"
          echo "TITLE_CARD_DURATION=$TITLE_CARD_DURATION"

          if [ ! -f "$TITLE_TEMPLATE_PATH" ]; then
            echo "❌ Title template does not exist"
            exit 1
          fi

          echo "✅ Title page configuration valid"

      # ==================================================
      # Python syntax validation
      # ==================================================
      - name: Validate Python source
        run: |
          echo "Checking Python syntax..."

          python -m py_compile main.py

          for file in smart_video/*.py; do
            echo "Checking $file"
            python -m py_compile "$file"
          done

          echo "✅ All Python files passed syntax validation"

      # ==================================================
      # Run modular video generator
      # ==================================================
      - name: Run Video Generator
        run: |
          echo "=========================================="
          echo "Starting Smart Video Generator"
          echo "=========================================="

          echo ""
          echo "Title template:"
          echo "$TITLE_TEMPLATE_PATH"

          echo ""
          echo "Running:"
          echo "python main.py"

          python main.py

      # ==================================================
      # Verify generated video
      # ==================================================
      - name: Verify generated video
        run: |
          echo "=========================================="
          echo "Checking generated video"
          echo "=========================================="

          if [ ! -f "final_video.mp4" ]; then
            echo "❌ final_video.mp4 was not generated"
            exit 1
          fi

          if [ ! -s "final_video.mp4" ]; then
            echo "❌ final_video.mp4 is empty"
            exit 1
          fi

          echo "✅ Video generated successfully"

          ls -lh final_video.mp4

          echo ""
          echo "Video information:"
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            final_video.mp4 || true

      # ==================================================
      # Upload generated video
      # ==================================================
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4
          if-no-files-found: error
          retention-days: 7

      # ==================================================
      # Upload generated assets
      # ==================================================
      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            audio/**
            images/**
            test_hindi.mp3
            test_english.mp3
          if-no-files-found: warn
          retention-days: 7