name: Generate Video

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:

      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Install ffmpeg
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validate MongoDB connection string
      - name: Validate MongoDB URI
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "❌ MONGODB_URI is EMPTY"
            exit 1
          else
            echo "✅ MONGODB_URI is configured"
          fi

      # Run video generator
      - name: Run Video Generator
        run: |
          python script.py

      # Upload generated video
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4