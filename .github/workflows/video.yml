name: Generate Video

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # --------------------------------------------------
      # Final Like / Subscribe page
      # Change this to your actual page
      # --------------------------------------------------
      CTA_URL: "https://www.facebook.com/thesmartlearninglab"

      # Optional logo configuration
      LOGO_PATH: "logo.png"
      LOGO_SIZE: "125"
      LOGO_MARGIN: "18"
      END_CARD_DURATION: "5"

    steps:

      # --------------------------------------------------
      # Checkout code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # --------------------------------------------------
      # Verify Python
      # --------------------------------------------------
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # --------------------------------------------------
      # Install system dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra

          fc-cache -f -v

      # --------------------------------------------------
      # Verify Hindi fonts
      # --------------------------------------------------
      - name: Verify Hindi fonts
        run: |
          echo "Checking Devanagari fonts..."

          fc-list :lang=hi family file | head -20

          echo "Checking Noto Devanagari fonts..."

          find /usr/share/fonts -iname "*Devanagari*" | head -20

      # --------------------------------------------------
      # Verify logo
      # --------------------------------------------------
      - name: Verify Smart Learning Lab logo
        run: |
          if [ -f "logo.png" ]; then
            echo "✅ logo.png found"
            ls -lh logo.png
          else
            echo "❌ logo.png NOT found"
            echo "The video generator requires logo.png in the repository root."
            exit 1
          fi

      # --------------------------------------------------
      # Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Required for final QR-code CTA page
          python -m pip install qrcode

      # --------------------------------------------------
      # Verify Edge TTS
      # --------------------------------------------------
      - name: Verify Edge TTS
        run: |
          edge-tts --version

      # --------------------------------------------------
      # Verify QR code package
      # --------------------------------------------------
      - name: Verify QR Code
        run: |
          python - <<'PY'
          import qrcode

          print("✅ qrcode package installed")
          print("qrcode version:", getattr(qrcode, "__version__", "installed"))
          PY

      # --------------------------------------------------
      # Test Hindi TTS
      # --------------------------------------------------
      - name: Test Hindi TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              text = "एक विशाल पहाड़ी जंगल में अर्जुन नाम का एक लकड़हारा रहता था।"

              communicate = edge_tts.Communicate(
                  text=text,
                  voice="hi-IN-SwaraNeural",
                  rate="-15%"
              )

              await communicate.save("test_hindi.mp3")

          asyncio.run(main())

          print("✅ Hindi TTS test completed successfully")
          PY

      # --------------------------------------------------
      # Test English TTS
      # --------------------------------------------------
      - name: Test English TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              text = "Deep inside a vast mountain forest, Arjun lived in a small cabin."

              communicate = edge_tts.Communicate(
                  text=text,
                  voice="en-IN-NeerjaNeural",
                  rate="-15%"
              )

              await communicate.save("test_english.mp3")

          asyncio.run(main())

          print("✅ English TTS test completed successfully")
          PY

      # --------------------------------------------------
      # Validate MongoDB connection string
      # --------------------------------------------------
      - name: Validate MongoDB URI
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "❌ MONGODB_URI is EMPTY"
            exit 1
          else
            echo "✅ MONGODB_URI is configured"
          fi

      # --------------------------------------------------
      # Validate Groq API key
      # --------------------------------------------------
      - name: Validate Groq API key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ GROQ_API_KEY is configured"
          fi

      # --------------------------------------------------
      # Validate CTA URL
      # --------------------------------------------------
      - name: Validate CTA URL
        run: |
          if [ -z "$CTA_URL" ]; then
            echo "❌ CTA_URL is EMPTY"
            exit 1
          else
            echo "✅ CTA_URL configured"
            echo "CTA page: $CTA_URL"
          fi

      # --------------------------------------------------
      # Run video generator
      # --------------------------------------------------
      - name: Run Video Generator
        run: |
          python script.py

      # --------------------------------------------------
      # Verify generated video
      # --------------------------------------------------
      - name: Verify generated video
        run: |
          if [ ! -f "final_video.mp4" ]; then
            echo "❌ final_video.mp4 was not generated"
            exit 1
          fi

          if [ ! -s "final_video.mp4" ]; then
            echo "❌ final_video.mp4 is empty"
            exit 1
          fi

          echo "✅ Video generated successfully"
          ls -lh final_video.mp4

      # --------------------------------------------------
      # Upload generated video
      # --------------------------------------------------
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4
          if-no-files-found: error

      # --------------------------------------------------
      # Upload generated assets for debugging
      # --------------------------------------------------
      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            audio/**
            images/**
            test_hindi.mp3
            test_english.mp3
          if-no-files-found: warn