name: Generate Video

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # Verify Python
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      # Install ffmpeg
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Validate MongoDB connection string
      - name: Validate MongoDB URI
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "❌ MONGODB_URI is EMPTY"
            exit 1
          else
            echo "✅ MONGODB_URI is configured"
          fi

      # Validate Groq API key
      - name: Validate Groq API key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ GROQ_API_KEY is configured"
          fi

      # Run video generator
      - name: Run Video Generator
        run: |
          python script.py

      # Upload generated video
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4
          if-no-files-found: error